services:
  outpost:
    image: "${OUTPOST_IMAGE:-cbnventures/outpost:latest}"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      S6_READ_ONLY_ROOT: "${S6_READ_ONLY_ROOT:-0}"
      TZ: "${TZ:-UTC}"

      # Six-field cron (with seconds). Default: every day at 04:00.
      OUTPOST_SCHEDULE: "${OUTPOST_SCHEDULE:-0 0 4 * * *}"
      OUTPOST_RUN_ON_START: "${OUTPOST_RUN_ON_START:-false}"

      # "opt-out" updates every container unless labeled
      # io.cbnventures.outpost.enable=false; "opt-in" only updates
      # containers labeled io.cbnventures.outpost.enable=true.
      OUTPOST_LABEL_MODE: "${OUTPOST_LABEL_MODE:-opt-out}"
      OUTPOST_MONITOR_ONLY: "${OUTPOST_MONITOR_ONLY:-false}"
      OUTPOST_CLEANUP: "${OUTPOST_CLEANUP:-true}"

      # Dashboard at http://localhost:3000/admin/ (locked until a password is set).
      OUTPOST_ADMIN_USERNAME: "${OUTPOST_ADMIN_USERNAME:-admin}"
      OUTPOST_ADMIN_PASSWORD_FILE: /run/secrets/outpost_admin_password
      # Set to "true" only when a reverse proxy you control sits in front of Outpost.
      OUTPOST_TRUST_PROXY: "${OUTPOST_TRUST_PROXY:-false}"

      # Enables POST /v1/update, GET /v1/status, and GET /metrics.
      OUTPOST_API_TOKEN: "${OUTPOST_API_TOKEN:-}"

      # Optional notifications (an ntfy topic URL and/or a JSON webhook).
      OUTPOST_NTFY_URL: "${OUTPOST_NTFY_URL:-}"
      OUTPOST_NTFY_TOKEN: "${OUTPOST_NTFY_TOKEN:-}"
      OUTPOST_WEBHOOK_URL: "${OUTPOST_WEBHOOK_URL:-}"
    secrets:
      - outpost_admin_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

      # Update history shown in the dashboard.
      - outpost-data:/data

      # Private registries: mount the config.json written by "docker login".
      # - ~/.docker/config.json:/config/config.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

    # The appliance supports a read-only root filesystem when project-specific
    # writable paths are mounted, s6 runtime paths use tmpfs, and
    # S6_READ_ONLY_ROOT is set to 1.
    # read_only: true
    # tmpfs:
    #   - /run
    #   - /tmp

secrets:
  outpost_admin_password:
    # A file containing the dashboard password, e.g. created with:
    # openssl rand -base64 24 > ./outpost-admin-password.txt
    file: "${OUTPOST_ADMIN_PASSWORD_SECRET_FILE:-./outpost-admin-password.txt}"

volumes:
  outpost-data:
